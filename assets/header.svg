<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Yuan Hongbo — long-term memory for work assistants">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1512"/>
      <stop offset="0.55" stop-color="#122019"/>
      <stop offset="1" stop-color="#1b2a1f"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3e6c8"/>
      <stop offset="1" stop-color="#e9b872"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79c7a5" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3d7f68" stop-opacity="0.65"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#2b4436" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="240" fill="url(#bg)"/>
  <rect width="1000" height="240" fill="url(#grid)" opacity="0.5"/>

  <!-- folded memory layers on the right -->
  <g transform="translate(690 44)" filter="url(#soft)">
    <path d="M120 8 L226 52 L120 96 L14 52 Z" fill="url(#fold)" opacity="0.30"/>
    <path d="M120 54 L226 98 L120 142 L14 98 Z" fill="url(#fold)" opacity="0.22"/>
    <path d="M120 100 L226 144 L120 188 L14 144 Z" fill="url(#fold)" opacity="0.14"/>
    <path d="M14 52 L120 96 L120 142 L14 98 Z" fill="#0e1a14" opacity="0.55"/>
    <path d="M226 52 L120 96 L120 142 L226 98 Z" fill="#0e1a14" opacity="0.75"/>
    <circle cx="120" cy="52" r="4.5" fill="#e9b872"/>
    <circle cx="120" cy="98" r="3.5" fill="#79c7a5"/>
    <circle cx="120" cy="144" r="3.5" fill="#79c7a5" opacity="0.7"/>
    <!-- provenance threads -->
    <g stroke="#79c7a5" stroke-opacity="0.5" stroke-width="1.2" fill="none">
      <path d="M120 52 C 60 40, 30 70, 14 144"/>
      <path d="M120 52 C 178 34, 210 60, 226 144"/>
      <path d="M120 98 C 70 88, 56 120, 44 144"/>
    </g>
    <circle cx="14" cy="144" r="2.6" fill="#e9b872"/>
    <circle cx="226" cy="144" r="2.6" fill="#e9b872"/>
    <circle cx="44" cy="144" r="2.2" fill="#e9b872" opacity="0.8"/>
  </g>

  <g transform="translate(64 66)">
    <text x="0" y="0" font-family="'Iowan Old Style','Palatino Linotype',Georgia,serif" font-size="15" letter-spacing="4.5" fill="#79c7a5">PERSONAL AGENT · LONG-TERM MEMORY</text>
    <text x="0" y="58" font-family="'Iowan Old Style','Palatino Linotype',Georgia,serif" font-size="52" font-weight="600" fill="url(#ink)">Yuan Hongbo</text>
    <text x="0" y="96" font-family="'Iowan Old Style','Palatino Linotype',Georgia,serif" font-size="25" fill="#d8cdb2">袁洪波</text>
    <text x="0" y="134" font-family="'SFMono-Regular',Consolas,monospace" font-size="13.5" letter-spacing="1.2" fill="#9fb8a8">remember deliberately · recall with evidence · forget on request</text>
  </g>

  <text x="64" y="214" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" letter-spacing="1.6" fill="#6f8a79">THE CHINESE UNIVERSITY OF HONG KONG · HONG KONG</text>
  <text x="936" y="214" text-anchor="end" font-family="'Iowan Old Style',Georgia,serif" font-size="12" fill="#6f8a79">mnemofold</text>
</svg>
