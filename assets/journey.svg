<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-label="mnemofold build journey">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141f19"/>
      <stop offset="1" stop-color="#1d2a21"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9b872"/>
      <stop offset="0.55" stop-color="#79c7a5"/>
      <stop offset="1" stop-color="#3d7f68"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="209" rx="14" fill="url(#paper)" stroke="#2b4436"/>
  <text x="34" y="38" font-family="'Iowan Old Style',Georgia,serif" font-size="15" letter-spacing="3" fill="#9fb8a8">MNEMOFOLD · 从工作事件到可引用的长期记忆</text>

  <line x1="60" y1="120" x2="940" y2="120" stroke="url(#spine)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- milestone 1 -->
  <g>
    <circle cx="110" cy="120" r="7" fill="#141f19" stroke="#e9b872" stroke-width="2.5"/>
    <text x="110" y="92" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#e9b872">2025 · 事件层</text>
    <text x="110" y="152" text-anchor="middle" font-family="'Iowan Old Style',Georgia,serif" font-size="13" fill="#d8cdb2">typed events</text>
    <text x="110" y="170" text-anchor="middle" font-family="'Iowan Old Style',Georgia,serif" font-size="13" fill="#8fa898">journal · clock</text>
  </g>
  <!-- milestone 2 -->
  <g>
    <circle cx="318" cy="120" r="7" fill="#141f19" stroke="#b9c98a" stroke-width="2.5"/>
    <text x="318" y="92" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#b9c98a">2025 · 解析</text>
    <text x="318" y="152" text-anchor="middle" font-family="'Iowan Old Style',Georgia,serif" font-size="13" fill="#d8cdb2">episodes · entities</text>
    <text x="318" y="170" text-anchor="middle" font-family="'Iowan Old Style',Georgia,serif" font-size="13" fill="#8fa898">commitments · as-of</text>
  </g>
  <!-- milestone 3 -->
  <g>
    <circle cx="526" cy="120" r="7" fill="#141f19" stroke="#79c7a5" stroke-width="2.5"/>
    <text x="526" y="92" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#79c7a5">2025–2026 · 折叠</text>
    <text x="526" y="152" text-anchor="middle" font-family="'Iowan Old Style',Georgia,serif" font-size="13" fill="#d8cdb2">consolidation</text>
    <text x="526" y="170" text-anchor="middle" font-family="'Iowan Old Style',Georgia,serif" font-size="13" fill="#8fa898">conflicts · decay</text>
  </g>
  <!-- milestone 4 -->
  <g>
    <circle cx="734" cy="120" r="7" fill="#141f19" stroke="#67a98c" stroke-width="2.5"/>
    <text x="734" y="92" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#67a98c">2026 · 助理</text>
    <text x="734" y="152" text-anchor="middle" font-family="'Iowan Old Style',Georgia,serif" font-size="13" fill="#d8cdb2">ledger · triage</text>
    <text x="734" y="170" text-anchor="middle" font-family="'Iowan Old Style',Georgia,serif" font-size="13" fill="#8fa898">prep · review</text>
  </g>
  <!-- milestone 5 -->
  <g>
    <circle cx="920" cy="120" r="7" fill="#141f19" stroke="#3d7f68" stroke-width="2.5"/>
    <text x="920" y="92" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="11.5" fill="#3d7f68">2026 · 评测</text>
    <text x="920" y="152" text-anchor="middle" font-family="'Iowan Old Style',Georgia,serif" font-size="13" fill="#d8cdb2">planted truth</text>
    <text x="920" y="170" text-anchor="middle" font-family="'Iowan Old Style',Georgia,serif" font-size="13" fill="#8fa898">replay · reports</text>
  </g>

  <!-- small ticks -->
  <g fill="#3d7f68" opacity="0.8">
    <circle cx="214" cy="120" r="2.6"/><circle cx="422" cy="120" r="2.6"/>
    <circle cx="630" cy="120" r="2.6"/><circle cx="827" cy="120" r="2.6"/>
  </g>
</svg>
